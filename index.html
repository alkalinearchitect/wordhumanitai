<body>
  <div id="top"></div>
  <div id="world"></div>
  <noscript>
    <div style="max-width:640px;margin:0 auto;padding:80px 24px;text-align:center;color:#f4f1fb;font-family:system-ui,sans-serif">
      <h1 style="font-size:2rem;color:#7A5CFF;margin:0 0 16px">HumanitAI OS</h1>
      <p style="font-size:1.1rem;line-height:1.6;color:#9a8fc0">A national prevention operating system that uses predictive intelligence, mobile 5th Spaces, and contrast therapy to help communities identify pressure early and connect people with support before crisis. First UK pilot: Bath.</p>
      <p style="margin-top:32px"><a href="about.html" style="color:#7A5CFF;font-weight:600">Learn more about our model →</a></p>
    </div>
  </noscript>
  <div class="ha-word">HumanitAI OS — no one left behind by the systems meant to serve them. Predict pressure. Deploy the boat. Open the 5th Space. Prevent crisis.</div>

  <script src="scrub-engine.js"></script>
  <script>
    mountScrollWorld(document.getElementById('world'), {
      brand: { name: 'HumanitAI OS', href: '#top' },
      cta: { label: 'Fund the pilot', href: '#top' },
      hint: 'scroll to fly through',
      diveScroll: 1.25,
      connScroll: 0.7,
      atmosphere: true,
      nav: true,
      sections: [
        {
          id: 'why', label: 'Why we exist',
          still: 'assets/hero.jpg',
          clip: 'assets/vid/hero.mp4',
          clipMobile: 'assets/vid/m/hero.mp4',
          accent: '#7A5CFF',
          eyebrow: 'Why we exist',
          title: 'No one should be invisible.',
          body: 'Pressure builds in silence -> communities fracture before services notice -> prevention becomes a duty, not a choice. HumanitAI OS exists because the cost of waiting is paid by the people least able to absorb it. We start with why: a nation that prevents harm outperforms one that merely treats it.',
          tags: ['Prevention-first', 'Social Duty', 'Invisible No More'],
        },
        {
          id: 'intelligence', label: 'The Brain',
          still: 'assets/ads1.jpg',
          clip: 'assets/vid/ads1.mp4',
          clipMobile: 'assets/vid/m/ads1.mp4',
          accent: '#7A5CFF',
          eyebrow: 'The Brain',
          title: 'Intelligence Layer — where pressure emerges.',
          body: 'Signals surface across public data, community observation and local intelligence -> the AI detects patterns of rising need -> priorities are set before crisis arrives. The Brain answers one question constantly: where should we act next? Evidence, not assumption, directs every deployment.',
          tags: ['Predictive Intelligence', 'Risk Mapping', 'Resource Direction'],
        },
        {
          id: 'mobility', label: 'The Nervous System',
          still: 'assets/ads1.jpg',
          clip: 'assets/vid/ads1.mp4',
          clipMobile: 'assets/vid/m/ads1.mp4',
          accent: '#C41E3A',
          eyebrow: 'The Nervous System',
          title: 'Mobility Layer — the boat deploys.',
          body: 'Intelligence indicates where need is gathering -> the boat deploys as a mobile prevention unit -> resources arrive like an ambulance carries care. The vessel is not transport; it is the nervous system moving prevention to the doorstep. No community is too remote to reach.',
          tags: ['Mobile Deployment', 'Prevention Logistics', 'Reach Every Shore'],
        },
        {
          id: 'engagement', label: 'The Front Door',
          still: 'assets/ads2.jpg',
          clip: 'assets/vid/ads2.mp4',
          clipMobile: 'assets/vid/m/ads2.mp4',
          accent: '#9B7EBD',
          eyebrow: 'The Front Door',
          title: 'Engagement Layer — contrast therapy attracts.',
          body: 'The boat opens a 5th Space -> contrast therapy draws people in with warmth, recovery and curiosity -> the front door feels like belonging, never a clinic. People arrive for themselves, not a referral. The lowest barrier is the first genuine human welcome.',
          tags: ['Contrast Therapy', 'Low-Barrier Entry', 'Community Welcome'],
        },
        {
          id: 'regulation', label: 'Recovery',
          still: 'assets/ads2.jpg',
          clip: 'assets/vid/ads2.mp4',
          clipMobile: 'assets/vid/m/ads2.mp4',
          accent: '#9B7EBD',
          eyebrow: 'Recovery',
          title: 'Regulation Layer — the nervous system settles.',
          body: 'People arrive -> breath, heat and cold guide the body into regulation -> the environment for learning and connection is prepared naturally. This is recovery education, not medical treatment; responses vary and that is expected. A settled mind is ready to engage.',
          tags: ['Nervous-System Regulation', 'Recovery Education', 'Ready to Engage'],
        },
        {
          id: 'connection', label: 'Where transformation happens',
          still: 'assets/ads3.jpg',
          clip: 'assets/vid/ads3.mp4',
          clipMobile: 'assets/vid/m/ads3.mp4',
          accent: '#7A5CFF',
          eyebrow: 'Where transformation happens',
          title: 'Connection Layer — the people become the system.',
          body: 'Regulated individuals meet -> trust forms and neighbours help one another -> social capital compounds into resilient communities. The sauna recedes; the relationships remain. Transformation lives here, in the space between people, not in any device we deploy.',
          tags: ['Social Capital', 'Community Resilience', 'Peer Connection'],
        },
        {
          id: 'opportunity', label: 'The Open Door',
          still: 'assets/ads3.jpg',
          clip: 'assets/vid/ads3.mp4',
          clipMobile: 'assets/vid/m/ads3.mp4',
          accent: '#27c93f',
          eyebrow: 'The Open Door',
          title: 'Opportunity Layer — from warmth to work.',
          body: 'A person came for recovery -> they discover employment, AI education, digital skills, volunteering and enterprise -> they leave with agency, not just relief. The 5th Space becomes a launchpad for contribution. Prevention that ends in opportunity is prevention that pays back.',
          tags: ['Skills Pathways', 'Employment', 'Social Mobility'],
        },
        {
          id: 'partnerships', label: 'Orchestration',
          still: 'assets/hero.jpg',
          clip: 'assets/vid/hero.mp4',
          clipMobile: 'assets/vid/m/hero.mp4',
          accent: '#7A5CFF',
          eyebrow: 'Orchestration',
          title: 'Partnerships Layer — we connect, not compete.',
          body: 'Need outruns any single organisation -> HumanitAI orchestrates NHS, councils, charities, universities and employers -> existing services are amplified, not replaced. We are the connector that makes the wider system coherent. Complementarity is what makes national scale fundable.',
          tags: ['Orchestration', 'System Complement', 'Collective Delivery'],
        },
        {
          id: 'platform', label: 'Shared Intelligence',
          still: 'assets/ads1.jpg',
          clip: 'assets/vid/ads1.mp4',
          clipMobile: 'assets/vid/m/ads1.mp4',
          accent: '#7A5CFF',
          eyebrow: 'Shared Intelligence',
          title: 'National Knowledge Platform — Bath becomes Britain.',
          body: 'Every pilot generates playbooks, outcome reports and trained models -> the learning is codified into a national replication framework -> the next town starts where the last one proved. Bath is not a one-off; it is the source code for UK prevention. Evidence compounds into national capability.',
          tags: ['Replication Framework', 'Open Playbooks', 'National Scale'],
        },
        {
          id: 'loop', label: 'The Loop',
          still: 'assets/ads3.jpg',
          clip: 'assets/vid/ads3.mp4',
          clipMobile: 'assets/vid/m/ads3.mp4',
          accent: '#7A5CFF',
          eyebrow: 'Closing',
          title: 'The Loop — deploy, learn, deploy again.',
          body: 'Communities strengthen -> evidence is collected -> the AI improves and points to the next pressure point -> the boat deploys again. This is not a programme with an end date; it is an operating system that gets sharper with every cycle. Invest once in the loop, and prevention compounds for a generation.',
          tags: ['Continuous Improvement', 'Measurable SROI', 'Self-Reinforcing System'],
          cta: { primary: { label: 'Fund the pilot', href: '#top' },
                 secondary: { label: 'See the method', href: '#top' } },
        },
      ],
      connectors: [
        'assets/vid/conn_hero_ads1.mp4',
        'assets/vid/conn_ads1_ads2.mp4',
        'assets/vid/conn_ads2_ads3.mp4',
      ],
    });
  </script>
