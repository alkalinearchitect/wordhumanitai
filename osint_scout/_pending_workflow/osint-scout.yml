name: OSINT Scout (hourly)

on:
  schedule:
    - cron: "17 * * * *"   # hourly, off the :00 mark
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run OSINT dry-run
        run: python3 osint_scout/scout.py
      # To go live, set HUMANITAI_LIVE_OSINT=1 and wire delivery.py to a sender,
      # then call the scheduler API: uvicorn osint_scout.scheduler_api:app
